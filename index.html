<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOMRAT AI PRO</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#212121;
 color:white;
 font-family:Arial,sans-serif;
 display:flex;
 flex-direction:column;
 height:100vh;
}
header{
 padding:17px;
 background:#171717;
 border-bottom:1px solid #333;
 font-size:21px;
 font-weight:bold;
}
#chat{
 flex:1;
 overflow-y:auto;
 padding:18px;
 max-width:850px;
 width:100%;
 margin:auto;
}
.welcome{
 text-align:center;
 margin-top:18vh;
 font-size:25px;
}
.message{
 padding:13px 16px;
 margin:12px 0;
 border-radius:15px;
 line-height:1.6;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.user{
 background:#343434;
 margin-left:auto;
 max-width:85%;
 width:fit-content;
}
.bot{max-width:100%}
.bottom{
 padding:15px;
 background:#212121;
}
form{
 max-width:800px;
 margin:auto;
 display:flex;
 gap:8px;
 background:#303030;
 padding:10px;
 border-radius:25px;
}
input{
 flex:1;
 min-width:0;
 background:transparent;
 border:0;
 outline:none;
 color:white;
 font-size:16px;
 padding:8px;
}
button{
 border:0;
 border-radius:20px;
 background:#10a37f;
 color:white;
 padding:11px 17px;
 cursor:pointer;
}
button:disabled{
 opacity:.5;
 cursor:not-allowed;
}
small{
 display:block;
 text-align:center;
 color:#999;
 padding:8px;
}
</style>
</head>

<body>

<header>✦ SOMRAT AI PRO</header>

<div id="chat">
 <div class="welcome" id="welcome">
  <h2>কীভাবে সাহায্য করতে পারি?</h2>
  <p style="font-size:15px;color:#aaa">
   Welcome to SOMRAT AI PRO
  </p>
 </div>
</div>

<div class="bottom">
 <form id="form">
  <input id="input"
   placeholder="আপনার প্রশ্ন লিখুন..."
   autocomplete="off">
  <button id="send" type="submit">➤</button>
 </form>
 <small>SOMRAT AI PRO</small>
</div>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");

// তোমার Render সার্ভারের ঠিকানা
const API_URL = "https://somrat-ai-pro.onrender.com/api/chat";

// কথোপকথনের ইতিহাস
const messages = [];

function addMessage(text, type) {
 const welcome = document.getElementById("welcome");
 if (welcome) welcome.remove();

 const div = document.createElement("div");
 div.className = "message " + type;
 div.textContent = text;

 chat.appendChild(div);
 chat.scrollTop = chat.scrollHeight;

 return div;
}

form.addEventListener("submit", async function(e) {
 e.preventDefault();

 const question = input.value.trim();
 if (!question || send.disabled) return;

 addMessage(question, "user");

 messages.push({
  role: "user",
  content: question
 });

 input.value = "";
 send.disabled = true;
 input.disabled = true;

 const loading = addMessage("SOMRAT AI উত্তর তৈরি করছে...", "bot");

 try {
  const response = await fetch(API_URL, {
   method: "POST",
   headers: {
    "Content-Type": "application/json"
   },
   body: JSON.stringify({
    messages: messages
   })
  });

  const data = await response.json();

  if (!response.ok) {
   throw new Error(data.error || "সার্ভার থেকে উত্তর পাওয়া যায়নি।");
  }

  const answer = data.reply || "কোনো উত্তর পাওয়া যায়নি।";

  loading.textContent = answer;

  messages.push({
   role: "assistant",
   content: answer
  });

 } catch (error) {
  loading.textContent =
   "দুঃখিত! সংযোগে সমস্যা হয়েছে।\n" +
   error.message +
   "\nকিছুক্ষণ পর আবার চেষ্টা করুন।";

  // ব্যর্থ প্রশ্নটি ইতিহাস থেকে সরানো
  messages.pop();

 } finally {
  send.disabled = false;
  input.disabled = false;
  input.focus();
  chat.scrollTop = chat.scrollHeight;
 }
});
</script>

</body>
</html>
